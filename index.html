<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Интерактивная карта ГЭС</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="map"></div>

<header id="topbar">
  <h1>⚡ Интерактивная карта ГЭС</h1>
  <p>Рельеф · климат · гидрология · катастрофы</p>
</header>

<div id="modeTabs">
  <button data-mode="history" class="active">📜 История</button>
  <button data-mode="forecast">🌤 Прогноз</button>
  <button data-mode="climate">🌍 Климат</button>
</div>

<div id="alertBanner">💥 ПРОРЫВ ПЛОТИНЫ</div>
<div id="statusBar"><b>Статус:</b> <span id="statusText">инициализация…</span></div>

<aside id="sidebar">
  <header>Сценарии</header>
  <div id="scenarios">
    <button class="scenBtn active" data-scen="normal">📊 Норма</button>
    <button class="scenBtn" data-scen="flood">🌊 Паводок</button>
    <button class="scenBtn" data-scen="drought">☀️ Засуха</button>
    <button class="scenBtn danger" data-scen="dam_break">💥 Прорыв</button>
  </div>
  <header style="border-top:1px solid var(--line)">ГЭС <span id="hppCount"></span></header>
  <div id="hppList"></div>
  <div id="details">
    <h3>Выберите ГЭС</h3>
    <p style="color:var(--dim);margin:0">Клик по маркеру или списку — детали и график.</p>
  </div>
</aside>

<div id="timeline">
  <button id="playBtn">▶</button>
  <div id="dateBox">—</div>
  <div id="sliderWrap">
    <input type="range" id="slider" min="0" max="0" value="0" step="1"/>
    <div class="ticks"><span id="tickA"></span><span id="tickB"></span><span id="tickC"></span></div>
  </div>
  <div id="speedBox">
    <span>скорость</span>
    <select id="speed">
      <option value="30">×1</option>
      <option value="10" selected>×3</option>
      <option value="3">×10</option>
      <option value="1">×30</option>
    </select>
  </div>
</div>

<section id="chartPanel">
  <div class="head"><b id="chartTitle">—</b><span id="chartSub"></span></div>
  <canvas id="chart"></canvas>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
